[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "underscore.pnp"
dynamic = ["version"]
description = "Touch-oriented, non-destructive music player for tabletop role-playing sessions"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
    "librosa>=0.10",
    "pyloudnorm>=0.1.1",
    "PySide6>=6.7",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
discord = ["discord.py[voice]>=2.6,<3"]

[project.scripts]
pnp-audio-test = "pnp_music_player.cli_audio:main"
pnp-analyze-track = "pnp_music_player.cli_analyze:main"
"underscore.pnp" = "pnp_music_player.ui.app:main"

[tool.setuptools.package-data]
pnp_music_player = ["ui/qml/*.qml", "ui/qml/components/*.qml", "ui/assets/*.png"]

[tool.setuptools.dynamic]
version = { attr = "pnp_music_player._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
